databases:
  - name: mcf-db
    plan: free

services:
  - type: web
    name: mcf-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: DATABASE_URL
        fromDatabase:
          name: mcf-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "demo"
